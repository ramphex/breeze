name: Throwaway API/Web Images

on:
  push:
    branches:
      - test/user-time-format-api-web-images
  workflow_dispatch:

concurrency:
  group: throwaway-api-web-images-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

permissions:
  contents: read

jobs:
  build-api-web:
    name: Build and push API/Web images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve image refs
        id: images
        shell: bash
        run: |
          image_name="$(printf '%s' "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          short_sha="${GITHUB_SHA::12}"
          version="user-time-format-${short_sha}"
          api_repo="${REGISTRY}/${image_name}/api"
          web_repo="${REGISTRY}/${image_name}/web"

          {
            echo "version=${version}"
            echo "api_repo=${api_repo}"
            echo "web_repo=${web_repo}"
            echo "api_tag=${api_repo}:${version}"
            echo "api_test_tag=${api_repo}:user-time-format-test"
            echo "web_tag=${web_repo}:${version}"
            echo "web_test_tag=${web_repo}:user-time-format-test"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - name: Log in to Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        id: build-api
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ steps.images.outputs.api_tag }}
            ${{ steps.images.outputs.api_test_tag }}
          build-args: |
            APP_VERSION=${{ steps.images.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Web image
        id: build-web
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ${{ steps.images.outputs.web_tag }}
            ${{ steps.images.outputs.web_test_tag }}
          build-args: |
            PUBLIC_APP_VERSION=${{ steps.images.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summarize image refs
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## API/Web test images

          API tag: \`${{ steps.images.outputs.api_tag }}\`
          API test tag: \`${{ steps.images.outputs.api_test_tag }}\`
          API digest ref: \`${{ steps.images.outputs.api_repo }}@${{ steps.build-api.outputs.digest }}\`

          Web tag: \`${{ steps.images.outputs.web_tag }}\`
          Web test tag: \`${{ steps.images.outputs.web_test_tag }}\`
          Web digest ref: \`${{ steps.images.outputs.web_repo }}@${{ steps.build-web.outputs.digest }}\`
          EOF
